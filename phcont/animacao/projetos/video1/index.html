<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #cfe3f2; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #cena { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .leg { position: absolute; left: 0; width: 1080px; top: 1640px; text-align: center; font-family: "Poppins", sans-serif;
        font-weight: 800; font-size: 76px; color: #fff; text-transform: uppercase; letter-spacing: .01em;
        -webkit-text-stroke: 10px #0b1426; paint-order: stroke fill; }
      .leg b { color: #ffd45a; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1080" data-height="1920">
      <audio id="voz" class="clip" src="assets/narracao.m4a" data-start="0" data-duration="4.2" data-track-index="2" data-volume="1"></audio>
      <canvas id="cena" class="clip" data-start="0" data-duration="4.2" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="l0" class="leg clip" data-start="0.05" data-duration="0.75" data-track-index="1"><b>ICMS,</b></div>
      <div id="l1" class="leg clip" data-start="0.8" data-duration="0.7" data-track-index="1"><b>ISS,</b></div>
      <div id="l2" class="leg clip" data-start="1.5" data-duration="1.1" data-track-index="1"><b>PIS</b> E <b>COFINS</b></div>
      <div id="l3" class="leg clip" data-start="2.6" data-duration="1.6" data-track-index="1">VÃO <b>ACABAR</b></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      ["#l0", "#l1", "#l2", "#l3"].forEach((s, i) => {
        const t = [0.05, 0.8, 1.5, 2.6][i];
        tl.fromTo(s, { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "power2.out" }, t);
      });
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import * as THREE from "./lib/three.module.js";

      const canvas = document.getElementById("cena");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(1080, 1920, false);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#c9dcea");
      scene.fog = new THREE.Fog("#cfe3f2", 30, 70);
      const cam = new THREE.PerspectiveCamera(38, 1080 / 1920, 0.1, 200);

      scene.add(new THREE.HemisphereLight("#ffffff", "#b9c9d6", 2.1));
      const sol = new THREE.DirectionalLight("#fff6e6", 2.4);
      sol.position.set(5, 14, 16);
      sol.castShadow = true;
      sol.shadow.mapSize.set(2048, 2048);
      Object.assign(sol.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14 });
      scene.add(sol);

      const grad = (() => { const d = new Uint8Array([200, 235, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
      const M = (c) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
      const LINHA = new THREE.MeshBasicMaterial({ color: "#151515", side: THREE.BackSide });
      function contorno(obj, esp = 0.045) {
        const novos = [];
        obj.traverse((m) => {
          if (!m.isMesh || m.userData.semLinha || m.userData.linha) return;
          const l = new THREE.Mesh(m.geometry, LINHA); l.userData.linha = true;
          m.geometry.computeBoundingSphere(); const r = m.geometry.boundingSphere.radius || 1;
          l.scale.setScalar(1 + esp / r); novos.push([m, l]);
        });
        novos.forEach(([m, l]) => m.add(l));
        return obj;
      }
      const sombra = (o) => { o.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); return o; };

      // ---- chão: praça em miniatura sobre base redonda
      const base = new THREE.Mesh(new THREE.CylinderGeometry(11, 11.4, 1.2, 48), M("#7fb069"));
      base.position.y = -0.6; base.receiveShadow = true; scene.add(base);
      const borda = new THREE.Mesh(new THREE.CylinderGeometry(11.45, 11.6, 0.6, 48), M("#5d4636"));
      borda.position.y = -1.3; scene.add(borda);
      const praca = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 6.5, 0.08, 40), M("#e8dcc0", 0.9));
      praca.position.y = 0.04; praca.receiveShadow = true; scene.add(praca);

      // árvores e prédios ao fundo
      function arvore(x, z, s = 1) {
        const g = new THREE.Group();
        const tronco = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.22 * s, 1.2 * s, 6), M("#7a5235"));
        tronco.position.y = 0.6 * s; g.add(tronco);
        const copa = new THREE.Mesh(new THREE.IcosahedronGeometry(0.95 * s, 0), M("#4f9a4a"));
        copa.position.y = 1.7 * s; g.add(copa);
        g.position.set(x, 0, z); return sombra(g);
      }
      [[-8.5, -3], [8.6, -2.5], [-7, -6.8], [7.2, -6.6], [-9.2, 2.5], [9.4, 3]].forEach(([x, z], i) => scene.add(arvore(x, z, 1 + (i % 3) * 0.15)));

      function textura(txt, bg, fg, w = 512, h = 256, fs = 140) {
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = bg; x.fillRect(0, 0, w, h);
        x.fillStyle = fg; x.font = `900 ${fs}px Poppins, Arial Black, sans-serif`; x.textAlign = "center"; x.textBaseline = "middle";
        x.fillText(txt, w / 2, h / 2 + 6);
        const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
      }

      function predio(x, z, cor, telhado, nome, larg = 4.2) {
        const g = new THREE.Group();
        const corpo = new THREE.Mesh(new THREE.BoxGeometry(larg, 3.2, 2.6), M(cor));
        corpo.position.y = 1.6; g.add(corpo);
        const teto = new THREE.Mesh(new THREE.CylinderGeometry(0.01, larg * 0.62, 1.5, 4), M(telhado));
        teto.rotation.y = Math.PI / 4; teto.scale.z = 0.62; teto.position.y = 3.95; g.add(teto);
        const placa = new THREE.Mesh(new THREE.PlaneGeometry(larg * 0.8, 0.7), new THREE.MeshBasicMaterial({ map: textura(nome, "#ffffff", "#1f2b42", 512, 96, 60) }));
        placa.position.set(0, 2.75, 1.31); g.add(placa);
        for (let i = 0; i < 3; i++) {
          const jan = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.8, 0.05), M("#bcd7ee", 0.3));
          jan.position.set(-larg / 3 + i * (larg / 3), 1.45, 1.31); g.add(jan);
        }
        const porta = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.3, 0.06), M("#5d4636"));
        porta.position.set(0, 0.65, 1.32); g.add(porta);
        g.position.set(x, 0, z); return sombra(contorno(g, 0.06));
      }
      scene.add(predio(-4.6, -6.2, "#3f7fc4", "#2b5c93", "PREFEITURA"));
      scene.add(predio(0.4, -7.2, "#f08a3a", "#c4612a", "COMÉRCIO"));
      scene.add(predio(5.3, -6.2, "#3aa067", "#2a7a4c", "INDÚSTRIA"));

      // ---- bonequinho (rig simples)
      function boneco({ pele = "#e9b48c", camisa = "#3f7fd6", calca = "#2a2f3a", cabelo = "#7a4a2a", sapato = "#4a2f22" } = {}) {
        const g = new THREE.Group();
        const corpo = new THREE.Mesh(new THREE.BoxGeometry(1.15, 1.55, 0.62), M(camisa)); corpo.position.y = 1.95; g.add(corpo);
        const cracha = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.26), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
        cracha.position.set(0.3, 2.3, 0.315); cracha.userData.semLinha = true; g.add(cracha);
        const pescoco = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.4, 12), M(pele)); pescoco.position.y = 2.85; g.add(pescoco);
        const pernas = [];
        for (const sx of [-0.28, 0.28]) {
          const p = new THREE.Group(); p.position.set(sx, 1.2, 0);
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.38, 1.1, 0.42), M(calca)); m.position.y = -0.55; p.add(m);
          const pe = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.24, 0.62), M(sapato)); pe.position.set(0, -1.08, 0.1); p.add(pe);
          g.add(p); pernas.push(p);
        }
        const bracos = [];
        for (const sx of [-0.72, 0.72]) {
          const b = new THREE.Group(); b.position.set(sx, 2.6, 0);
          const m = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.25, 0.34), M(camisa)); m.position.y = -0.6; b.add(m);
          const mao = new THREE.Mesh(new THREE.SphereGeometry(0.19, 14, 10), M(pele)); mao.position.y = -1.28; b.add(mao);
          g.add(b); bracos.push(b);
        }
        const cab = new THREE.Group(); cab.position.y = 3.75; g.add(cab);
        const cabeca = new THREE.Mesh(new THREE.SphereGeometry(0.92, 32, 24), M(pele)); cab.add(cabeca);
        // cabelo: calota + topete
        const calota = new THREE.Mesh(new THREE.SphereGeometry(0.95, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.38), M(cabelo));
        calota.rotation.x = -0.32; cab.add(calota);
        const topete = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 16), M(cabelo));
        topete.scale.set(1.25, 0.42, 0.85); topete.position.set(0.12, 0.72, 0.38); topete.rotation.z = -0.18; cab.add(topete);
        const olhos = [];
        for (const sx of [-0.3, 0.3]) {
          const br = new THREE.Mesh(new THREE.SphereGeometry(0.22, 24, 16), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
          br.position.set(sx, 0.12, 0.8); br.scale.set(0.9, 1.15, 0.45); cab.add(br);
          const pu = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshBasicMaterial({ color: "#151515" }));
          pu.position.set(sx, 0.1, 0.9); pu.scale.set(0.9, 1.2, 0.5); pu.userData.semLinha = true; cab.add(pu);
          const sob = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.07, 0.05), new THREE.MeshBasicMaterial({ color: "#3a2416" }));
          sob.position.set(sx, 0.47, 0.82); sob.rotation.z = sx < 0 ? 0.12 : -0.12; sob.userData.semLinha = true; cab.add(sob);
          olhos.push({ br, pu, sob });
        }
        // boca aberta sorrindo (meia-lua escura + dentes)
        const boca = new THREE.Group(); boca.position.set(0.02, -0.36, 0.86); cab.add(boca);
        const bocaM = new THREE.Mesh(new THREE.CircleGeometry(0.22, 24, Math.PI, Math.PI), new THREE.MeshBasicMaterial({ color: "#5a1414", side: THREE.DoubleSide }));
        bocaM.userData.semLinha = true; boca.add(bocaM);
        const dentes = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.06), new THREE.MeshBasicMaterial({ color: "#ffffff" }));
        dentes.position.set(0, -0.04, 0.01); dentes.userData.semLinha = true; boca.add(dentes);
        const lingua = new THREE.Mesh(new THREE.CircleGeometry(0.09, 16, Math.PI, Math.PI), new THREE.MeshBasicMaterial({ color: "#d9605a", side: THREE.DoubleSide }));
        lingua.position.set(0, -0.15, 0.01); lingua.userData.semLinha = true; boca.add(lingua);
        contorno(g);
        sombra(g);
        return { g, cab, bracos, pernas, olhos, boca };
      }
      const emp = boneco({});
      emp.g.scale.setScalar(1.0);
      emp.g.position.set(0, 0, 2.6);
      scene.add(emp.g);

      // ---- placas dos impostos
      const impostos = [["ICMS", "#c9ad6e", 0.0], ["ISS", "#c9ad6e", 0.8], ["PIS", "#c9ad6e", 1.5], ["COFINS", "#c9ad6e", 2.1]];
      const placas = impostos.map(([nome, cor, t0], i) => {
        const g = new THREE.Group();
        const poste = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 5.4, 8), M("#5d4636")); poste.position.y = 2.7; g.add(poste);
        const tab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.78, 0.14), M("#1f2b42"));
        tab.position.y = 5.7; g.add(tab);
        const face = new THREE.Mesh(new THREE.PlaneGeometry(1.38, 0.66), new THREE.MeshBasicMaterial({ map: textura(nome, "#1f2b42", "#e9cf8e", 512, 216, nome.length > 4 ? 110 : 140) }));
        face.position.set(0, 5.7, 0.08); g.add(face);
        const x = [-2.4, -0.8, 0.8, 2.4][i];
        g.position.set(x, 0, -0.6); g.rotation.y = -x * 0.05;
        sombra(contorno(g, 0.035)); scene.add(g);
        return { g, t0, x };
      });

      // poeira ("poof") quando somem
      const poofs = placas.map((p) => {
        const grp = new THREE.Group(); grp.position.set(p.x, 5.5, -0.5);
        for (let k = 0; k < 7; k++) {
          const s = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 1, transparent: true, opacity: 0, flatShading: true }));
          const a = (k / 7) * Math.PI * 2; s.userData = { a };
          grp.add(s);
        }
        scene.add(grp); return grp;
      });

      const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
      const back = (x) => { x = Math.min(1, Math.max(0, x)); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
      const QUEDA = 3.0;

      function renderAt(t) {
        // câmera: leve aproximação e giro
        const k = ease(t / 4.2);
        cam.position.set(Math.sin(-0.14 + k * 0.18) * 18.5, 6.6 - k * 0.5, Math.cos(-0.14 + k * 0.18) * 18.5);
        cam.lookAt(0, 4.1, 0);

        placas.forEach((p, i) => {
          const a = back((t - p.t0) / 0.45);
          let s = t < p.t0 ? 0.001 : Math.max(0.001, a);
          let y = 0, rz = 0;
          const tq = QUEDA + i * 0.08;
          if (t > tq) { const q = ease((t - tq) / 0.35); s = Math.max(0.001, 1 - q); y = -q * 0.4; rz = q * 0.6 * (i % 2 ? 1 : -1); }
          p.g.scale.setScalar(s); p.g.position.y = y; p.g.rotation.z = rz;
          const pf = poofs[i]; const u = (t - tq) / 0.6;
          pf.children.forEach((m) => {
            const on = u > 0 && u < 1;
            m.material.opacity = on ? 0.9 * (1 - u) : 0;
            const r = 0.3 + ease(u) * 1.3;
            m.position.set(Math.cos(m.userData.a) * r, Math.sin(m.userData.a) * r * 0.6 + ease(u) * 0.4, 0);
            m.scale.setScalar(on ? 0.6 + u * 0.8 : 0.001);
          });
        });

        // bonequinho: olha para cada placa que aparece, se assusta quando caem
        const alvo = placas.reduce((acc, p) => (t >= p.t0 ? p.x : acc), 0);
        const olharX = THREE.MathUtils.clamp(alvo / 3, -1, 1);
        emp.cab.rotation.y = olharX * 0.5 + Math.sin(t * 2.1) * 0.03;
        emp.cab.rotation.x = t < QUEDA ? -0.35 : -0.12;
        emp.olhos.forEach(({ pu }, j) => { pu.position.x = (j ? 0.3 : -0.3) + olharX * 0.08; });
        const susto = ease((t - QUEDA) / 0.25);
        emp.g.position.y = Math.sin(Math.PI * Math.min(1, Math.max(0, (t - QUEDA) / 0.4))) * 0.35;
        emp.bracos[0].rotation.z = -0.15 - susto * 2.4; emp.bracos[1].rotation.z = 0.15 + susto * 2.4;
        emp.bracos[0].rotation.x = emp.bracos[1].rotation.x = -susto * 0.3;
        emp.olhos.forEach(({ br, sob }) => { br.scale.set(0.9 * (1 + susto * 0.25), 1.15 * (1 + susto * 0.3), 0.45); sob.position.y = 0.47 + susto * 0.12; });
        emp.boca.scale.set(1 - susto * 0.25, 1 + susto * 1.1, 1);
        // respiração e piscada
        emp.g.children[0].scale.y = 1 + Math.sin(t * 3) * 0.015;
        const pisca = (t % 2.6) > 2.48 ? 0.15 : 1;
        emp.olhos.forEach(({ br, pu }) => { br.scale.y *= pisca; pu.scale.y = 1.2 * pisca; });

        renderer.render(scene, cam);
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(0);
    </script>
  </body>
</html>
