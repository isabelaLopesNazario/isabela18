<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070d1c; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #cam { position: absolute; left: 0; top: 860px; width: 1080px; height: 1060px; overflow: hidden; z-index: 4;
        border-top: 2px solid rgba(201,173,110,.55); box-shadow: 0 -10px 40px rgba(0,0,0,.55), 0 -2px 18px rgba(201,173,110,.25); }
      #cam-sombra { position: absolute; left: 0; top: 0; width: 1080px; height: 220px; z-index: 2;
        background: linear-gradient(180deg, rgba(9,16,34,.92) 0%, rgba(9,16,34,.55) 45%, rgba(9,16,34,0) 100%); }
      #logo-final { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 8; }
      #camcheia { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 4; }
      #camcheia video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cam video { position: absolute; left: 0; top: -420px; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25.08" data-width="1080" data-height="1920">
      <!-- Voz da apresentadora (contínua) -->
      <audio id="voz" class="clip" src="assets/fala.mp4" data-start="0" data-duration="23.24" data-track-index="5" data-volume="1"></audio>
      <!-- Começo: ela em tela cheia -->
      <div id="camcheia">
        <video id="fala0" class="clip" src="assets/fala.mp4" data-start="0" data-duration="4.98" data-media-start="0" data-track-index="1" muted playsinline></video>
        <video id="fala3" class="clip" src="assets/fala.mp4" data-start="20.00" data-duration="3.24" data-media-start="20.00" data-track-index="1" muted playsinline></video>
      </div>
      <!-- Final: tela da logo do vídeo bruto -->
      <video id="logo-final" class="clip" src="assets/logo_final.mp4" data-start="23.24" data-duration="1.84" data-track-index="6" muted playsinline></video>
      <!-- Metade de baixo: ela falando -->
      <div id="cam">
        <video id="fala2" class="clip" src="assets/fala.mp4" data-start="9.10" data-duration="11.50" data-media-start="9.10" data-track-index="1" muted playsinline></video>
        <div id="cam-sombra"></div>
      </div>
      <div id="fundo" data-composition-id="fundo" data-composition-src="compositions/fundo.html" data-start="0.00" data-duration="25.08" data-track-index="0" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="caixa" data-composition-id="caixa" data-composition-src="compositions/caixa.html" data-start="4.38" data-duration="4.82" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="problema" data-composition-id="problema" data-composition-src="compositions/problema.html" data-start="9.20" data-duration="4.35" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="fechamento" data-composition-id="fechamento" data-composition-src="compositions/fechamento.html" data-start="13.55" data-duration="3.05" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="lista" data-composition-id="lista" data-composition-src="compositions/lista.html" data-start="16.60" data-duration="3.64" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:3"></div>
      <div id="legendas" data-composition-id="legendas" data-composition-src="compositions/legendas.html" data-start="0.00" data-duration="23.24" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:5"></div>
      <div id="progresso" data-composition-id="progresso" data-composition-src="compositions/progresso.html" data-start="0.00" data-duration="25.08" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:6"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // gráfico em tela cheia: a metade de baixo desce e depois volta, suave
      tl.set("#cam", { opacity: 0 }, 0);
      tl.to("#camcheia", { opacity: 0, duration: 0.55, ease: "sine.inOut" }, 4.38);
      tl.to("#cam", { opacity: 1, duration: 0.5, ease: "sine.inOut" }, 9.10);
      // final: ela volta em tela cheia para o convite
      tl.to("#camcheia", { opacity: 1, duration: 0.45, ease: "sine.inOut" }, 20.06);
      tl.set("#cam", { opacity: 0 }, 20.53);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
