<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@1,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:#0c0c0c}
.f{position:absolute;left:0;top:-200px;width:1080px;height:1899px;background:url(foto_aluna.png) center top/cover}
.g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,8,.9) 0%,rgba(8,9,8,.72) 20%,rgba(8,9,8,.25) 32%,rgba(8,9,8,0) 42%)}
.g2{position:absolute;inset:0;background:linear-gradient(200deg,rgba(8,9,8,0) 55%,rgba(8,9,8,.55) 75%,rgba(8,9,8,.75) 100%)}
.logo{position:absolute;left:78px;top:58px;width:280px}
.tit{position:absolute;left:78px;top:150px;font-family:Anton,sans-serif;text-transform:uppercase;line-height:1;transform:skewX(-7deg);transform-origin:left;text-shadow:0 6px 24px rgba(0,0,0,.45)}
.l1{font-size:80px;color:#f8f8f8}.l2{font-size:140px;color:#ccf200}
.punho{position:absolute;left:520px;top:236px;width:118px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
.traco{position:absolute;left:78px;top:408px;width:150px;height:8px;background:#ccf200}
.base{position:absolute;right:70px;top:1090px;width:440px;text-align:right}
.data{display:inline-block;transform:skewX(-7deg);background:#ccf200;color:#0c0c0c;font-family:Anton,sans-serif;font-size:48px;padding:6px 20px 4px}
.frase{margin-top:22px;font-family:Poppins;font-style:italic;font-weight:500;font-size:38px;line-height:1.28;color:#f8f8f8;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.frase b{color:#ccf200;font-weight:500}
.curva{position:absolute;inset:0;pointer-events:none}
</style></head><body>
<div class="f"></div><div class="g"></div><div class="g2"></div>
<img class="logo" src="logo.png">
<div class="tit"><div class="l1">Dia da Consciência</div><div class="l2">Negra</div></div>
<div class="traco"></div>
<div class="base"><span class="data">20 DE NOVEMBRO</span>
<div class="frase">Força, resistência e respeito. <b>Dentro e fora do treino.</b></div></div>
<svg class="curva" viewBox="0 0 1080 1440"><path d="M900 -20 C 980 40, 1040 90, 1100 170" stroke="#ccf200" stroke-width="16" fill="none" stroke-linecap="round"/></svg>
</body></html>
