<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300&family=Poppins:ital,wght@1,500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1440px;overflow:hidden;background:#0c0c0c}
.f,.rec{position:absolute;left:0;top:-200px;width:1080px;height:1899px}
.f{background:url(foto_aluna.png) center top/cover}
.f,.rec{filter:brightness(.8) saturate(.9)}
.rec{object-fit:cover;object-position:center top}
.g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,8,.85) 0%,rgba(8,9,8,.35) 26%,rgba(8,9,8,0) 40%,rgba(8,9,8,0) 70%,rgba(8,9,8,.6) 100%)}
.logo{position:absolute;left:50%;top:34px;width:220px;transform:translateX(-50%)}
.cons{position:absolute;left:0;width:1080px;top:132px;text-align:center;font-family:Oswald;font-weight:300;font-size:58px;letter-spacing:.3em;padding-left:.3em;color:#f8f8f8}
.dia{position:absolute;left:0;width:1080px;top:92px;text-align:center;font-family:Poppins;font-style:italic;font-weight:500;font-size:34px;color:#ccf200}
.giga{position:absolute;left:0;width:1080px;top:212px;text-align:center;font-family:Anton;font-size:270px;line-height:.85;color:#ccf200;transform:skewX(-6deg);text-transform:uppercase}
.base{position:absolute;right:70px;top:960px;width:440px;text-align:right}
.data{display:inline-block;transform:skewX(-7deg);background:#ccf200;color:#0c0c0c;font-family:Anton;font-size:46px;padding:6px 20px 4px}
.frase{margin-top:20px;font-family:Poppins;font-style:italic;font-weight:500;font-size:36px;line-height:1.28;color:#f8f8f8;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.frase b{color:#ccf200;font-weight:500}
</style></head><body>
<div class="f"></div><div class="g"></div>
<div class="giga">Negra</div>
<img class="rec" src="aluna_recorte_limpo.png">
<img class="logo" src="logo.png">
<div class="dia">dia da</div>
<div class="cons">CONSCIÊNCIA</div>
<div class="base"><span class="data">20 DE NOVEMBRO</span><div class="frase">Força, resistência e respeito. <b>Dentro e fora do treino.</b></div></div>
</body></html>
