<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0c0c0c}
.f{position:absolute;left:0;top:-270px;width:1080px;height:1919px;background:url(foto.png) center/cover}
.g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,8,.86) 0%,rgba(8,10,8,.55) 22%,rgba(8,10,8,0) 38%,rgba(8,10,8,0) 66%,rgba(8,10,8,.7) 80%,rgba(8,10,8,.92) 100%)}
.top{position:absolute;left:70px;top:64px}
.tit{font-family:Anton,sans-serif;font-style:italic;text-transform:uppercase;color:#f8f8f8;line-height:.98;transform:skewX(-6deg);transform-origin:left}
.l1{font-size:118px}.l1 b{font-weight:400;color:#4a9bff}
.l2{font-size:78px;margin-top:6px}.l2 b{font-weight:400;background:#ccf200;color:#0c0c0c;padding:0 14px}
.traco{width:120px;height:8px;background:#ccf200;margin-top:24px;transform:skewX(-20deg)}
.laco{position:absolute;right:70px;top:78px;width:120px}
.base{position:absolute;left:70px;right:70px;bottom:70px}
.sub{font-family:Poppins;font-weight:600;font-size:40px;color:#f8f8f8;line-height:1.25}
.fim{font-family:Poppins;font-weight:500;font-size:36px;color:rgba(248,248,248,.9);margin-top:10px}
.fim b{color:#ccf200;font-weight:700}
.logo{position:absolute;right:70px;bottom:78px;width:210px}
</style></head><body><div class="f"></div><div class="g"></div>
<div class="top"><div class="tit l1">Novembro <b>Azul</b></div><div class="tit l2">Cuide de <b>você.</b></div><div class="traco"></div></div>
<svg class="laco" viewBox="0 0 100 150"><g fill="none" stroke="#4a9bff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M28 140 L 64 62 C 76 36, 70 12, 50 12 C 30 12, 24 36, 36 62 L 72 140"/></g></svg>
<div class="base"><div class="sub">Exame em dia e treino<br>na sua rotina.</div><div class="fim">Os dois fazem parte do <b>cuidado.</b></div></div>
<img class="logo" src="logo.png">
</body></html>
